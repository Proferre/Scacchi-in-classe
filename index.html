async function api(path,method='GET',body,token){
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),10000);
 try{const r=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+path,{method,signal:ctrl.signal,headers:{apikey:cfg.supabaseAnonKey,...(token?{Authorization:'Bearer '+token}:{}),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:body===undefined?undefined:JSON.stringify(body)});
 const text=await r.text();let data;try{data=text?JSON.parse(text):null}catch(e){throw Error('Risposta del servizio non valida')}
 if(!r.ok)throw Error(data?.msg||data?.message||data?.error_description||'Servizio non disponibile');return data;
 }finally{clearTimeout(timer)}
}
async function ensureStudent(){
 if(!cloud)return null;
 if(deviceAuth?.access_token&&deviceAuth.expires_at>Date.now()/1000+60)return deviceAuth;
 let x;
 if(deviceAuth?.refresh_token){x=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:deviceAuth.refresh_token});}
 else x=await api('/auth/v1/signup','POST',{});
 if(!x.access_token)throw Error('Accesso anonimo non abilitato');
 deviceAuth={...x,expires_at:x.expires_at||Date.now()/1000+x.expires_in};write('scacchi-v2-auth',deviceAuth);return deviceAuth;
}

async function syncPlayer(data){
 const a=await ensureStudent();const row={owner_id:a.user.id,class_code:cfg.classCode,nickname:data.name,progress:data,updated_at:new Date().toISOString()};

 const k=`${cfg.classCode||'locale'}:${data.name.toLocaleLowerCase('it')}`;

async function syncPending(){if(!cloud)return status();status('Sincronizzazione…');try{for(const p of Object.values(players))if(p.pending&&p.classCode===cfg.classCode)await syncPlayer(p);status('Risultati sincronizzati con il docente.')}catch(e){status('Invio in attesa: '+e.message)}}

const pts=(id,n)=>{const a=me.attempts[id]||{};return Math.max(1,Math.round(10*n*Math.max(.25,1-.25*(a.errors||0))*((a.hints||0)>.0?.5:1)))};

function login(){status();app.innerHTML=`<div class="c"><h2>Benvenuto! 👋</h2><p>Usa il nickname concordato con il docente, senza nome e cognome.</p><label for="nickname">Nickname</label><input id="nickname" maxlength="20" autocomplete="off"><button id="enter" class="big g">Entra</button><p id="error" role="alert"></p><small>Per ritrovare i tuoi progressi usa lo stesso PC, lo stesso browser e lo stesso nickname. Chi usa questo PC può riaprire i profili locali.</small></div><button class="s" data-go="teacherLogin">Accesso docente</button>`;wire();$('enter').onclick=enter;$('nickname').onkeydown=e=>{if(e.key==='Enter')enter()}}

 const page=st;$('enter').disabled=true;teacher=false;const k=`${cfg.classCode||'locale'}:${name.toLocaleLowerCase('it')}`;me=players[k]||{name,classCode:cfg.classCode||'locale',points:0,solved:{},attempts:{},games:{},revision:0};
 if(cloud){status('Collegamento all’archivio…');try{const a=await ensureStudent();const rows=await api('/rest/v1/progress?class_code=eq.'+encodeURIComponent(cfg.classCode)+'&nickname=eq.'+encodeURIComponent(me.name)+'&select=progress', 'GET',undefined,a.access_token);if(rows?.[0]?.progress&&!me.pending)me=rows[0].progress;status('Archivio collegato.')}catch(e){status('Archivio non raggiungibile: puoi lavorare in locale e sincronizzare dopo.')}}

}

function exerciseMenu(){app.innerHTML=navHeader('home','Esercitazioni')+[['F','🧩 Fondamentali',FUNDAMENTALS],...[1,2,3].map(n=>[n,'Matto in '+n+(n===1?' mossa':' mosse'),PUZZLES.filter(p=>p.n===n)])].map(([n,t,list])=>{let count=list.filter(p=>me.solved[p.id]).length;return `<button class="lv l${n==='F'?0:n}" data-group="${n}">${t}<small>${list.length} esercizi · ${count} completati</small><span class="bar"><i style="width:${100*count/list.length}%"></i></span></button>`}).join('')+'<p class="help">Inizia dai fondamentali e dai matti in una. In un matto in due giochi due mosse tue, con la risposta avversaria in mezzo. Gli aiuti riducono i punti, ma non impediscono di completare gli esercizi.</p>';finishUI();document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const list=b.dataset.group==='F'?FUNDAMENTALS:PUZZLES.filter(p=>p.n===+b.dataset.group);const i=Math.max(0,list.findIndex(p=>!me.solved[p.id]));b.dataset.group==='F'?startFund(i):startPuzzle(list,i)})}
function startPuzzle(list,i){cancel();const p=list[i],g=new Chess(p.fen);st={screen:'puzzle',list,i,p,g,col:g.turn(),flip:g.turn()==='b',made:0,sel:null,hs:null,hintStep:0,busy:false,done:false,msg:`Muove il ${g.turn()==='w'?'Bianco':'Nero'}. Trova il matto in ${p.n} ${p.n===1?'mossa':'mosse'}.`};render()}
function dots(list,i){return '<div class="dots" aria-label="Scegli esercizio">'+list.map((p,k)=>`<button class="${me.solved[p.id]?'done':''} ${k===i?'cur':''}" data-index="${k}" aria-label="Esercizio ${k+1}${me.solved[p.id]?', completato':''}">${k+1}</button>`).join('')+'</div>'}
function puzzle(){const s=st,g=s.g,node=s.p.graph[keyOf(g)],moves=s.sel&&!s.busy?g.moves({square:s.sel,verbose:true}).map(m=>m.to):[];app.innerHTML=navHeader('exerciseMenu',`Matto in ${s.p.n} · ⭐ ${pts(s.p.id,s.p.n)}`)+`<div class="c">${dots(s.list,s.i)}${boardHTML(g,s.sel,moves,s.hs,s.last,s.tg)}<div id="msg" role="status">${esc(s.msg)}</div><div class="row"><button id="hint" class="o" ${s.done||s.busy?'disabled':''}>💡 Aiuto</button><button id="restart" class="s">Ricomincia</button>${s.done?'<button id="next" class="g">Prossimo →</button>':''}</div></div>`;finishUI();$('restart').onclick=()=>startPuzzle(s.list,s.i);document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>startPuzzle(s.list,+b.dataset.index));if($('next'))$('next').onclick=()=>s.i+1<s.list.length?startPuzzle(s.list,s.i+1):go('exerciseMenu');
 $('hint').onclick=()=>{const u=Object.keys(node.moves)[0];attempt(s.p.id,false,true);s.hs=u.slice(0,2);s.tg=s.hintStep?u.slice(2,4):null;s.msg=s.hintStep?'Muovi da '+u.slice(0,2)+' a '+u.slice(2,4)+(u[4]?' e promuovi a '+NM[u[4]]:'')+'.':'Osserva il pezzo evidenziato. Quali case di fuga può togliere al re?';s.hintStep++;puzzle()};
 bind(square=>{if(s.done||s.busy)return;const candidates=g.moves({square:s.sel||undefined,verbose:true}).filter(m=>m.from===s.sel&&m.to===square);if(candidates.length){choosePromotion(candidates,m=>puzzleMove(m));return}const p=g.get(square);s.sel=p&&p.color===s.col?square:null;puzzle()})
}
function choosePromotion(ms,cb){if(!ms.some(m=>m.promotion))return cb(ms[0]);const owner=st;const div=document.createElement('div');div.id='promo';div.innerHTML='<div id="ov"><div class="c"><h2>Scegli la promozione</h2>'+ms.map(m=>`<button data-promotion="${m.promotion}">${NM[m.promotion]}</button>`).join('')+'<button class="s" id="cancelPromo">Annulla</button></div></div>';document.body.appendChild(div);div.querySelectorAll('[data-promotion]').forEach(b=>b.onclick=()=>{div.remove();if(st===owner)cb(ms.find(m=>m.promotion===b.dataset.promotion))});$('cancelPromo').onclick=()=>div.remove()}
function puzzleMove(m){const s=st,g=s.g,u=m.from+m.to+(m.promotion||''),node=s.p.graph[keyOf(g)];if(!Object.hasOwn(node.moves,u)){attempt(s.p.id,true);s.msg='Questa mossa non forza il matto nel numero richiesto. La posizione resta qui: riprova o chiedi un aiuto.';s.sel=null;snd('bad');return puzzle()}
 const moved=g.move(m);s.made++;s.sel=null;s.hs=null;s.tg=null;s.hintStep=0;s.last=[m.from,m.to];s.anim=s.last;sfx(g,moved);
 if(g.in_checkmate()){s.done=true;const n=award(s.p.id,pts(s.p.id,s.p.n));s.msg=`Scacco matto! ${teacher?'Prova docente.':n?'+'+n+' punti.':'Esercizio già completato.'} Il re è attaccato e non esiste una difesa legale.`;return puzzle()}
 s.busy=true;s.msg='Il computer sceglie una difesa verificata…';puzzle();const version=job;
 setTimeout(()=>{if(st!==s||version!==job)return;const reply=s.p.graph[keyOf(g)];const opts=Object.entries(reply.moves).sort((a,b)=>b[1]-a[1]);const u=opts[0][0];const mv=g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});s.busy=false;s.last=[mv.from,mv.to];s.anim=s.last;sfx(g,mv);s.msg=`Tocca a te: ${s.p.n-s.made} ${s.p.n-s.made===1?'mossa rimasta':'mosse rimaste'}.`;puzzle()},450)
}
function startFund(i){cancel();const e=FUNDAMENTALS[i];st={screen:'fundamental',i,e,g:new Chess(e.fen),cur:e.source,made:0,stuck:false,sel:null,pick:[],done:false,nochk:true,msg:''};render()}
function fundamental(){const s=st,e=s.e;app.innerHTML=navHeader('exerciseMenu',`Fondamentali · ⭐ ${pts(e.id,1)}`)+`<div class="c">${dots(FUNDAMENTALS,s.i)}<h2>${esc(e.title)}</h2><p class="help">${esc(e.question)}</p>${boardHTML(s.g,s.sel,e.type==='path'&&s.sel?s.g.moves({square:s.sel,verbose:true}).filter(m=>!m.captured).map(m=>m.to):[],e.type==='path'?s.cur:e.source,s.done&&e.type==='squares'?e.answer:e.type==='path'?s.last:s.pick,e.target)}<div id="msg" role="status">${esc(s.msg)}</div><div class="row">${s.done||e.type==='path'?'':e.type==='squares'?'<button id="check" class="g">Controlla</button>':e.options.map((o,i)=>`<button data-answer="${i}">${esc(o)}</button>`).join('')}</div><div class="row" style="margin-top:10px"><button id="hint" class="o" ${s.done?'disabled':''}>💡 Aiuto</button><button id="restart" class="s">Ricomincia</button>${s.done?'<button id="next" class="g">Prossimo →</button>':''}</div></div>`;finishUI();document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>startFund(+b.dataset.index));$('restart').onclick=()=>startFund(s.i);$('hint').onclick=()=>{attempt(e.id,false,true);s.msg=e.hint;fundamental()};if($('check'))$('check').onclick=()=>checkFund(JSON.stringify([...s.pick].sort())===JSON.stringify([...e.answer].sort()));document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>checkFund(+b.dataset.answer===e.answer));if($('next'))$('next').onclick=()=>s.i+1<FUNDAMENTALS.length?startFund(s.i+1):go('exerciseMenu');bind(square=>{if(s.done||s.stuck)return;if(e.type==='path'){const ms=s.g.moves({verbose:true}).filter(m=>m.from===s.sel&&m.to===square&&!m.captured);if(ms.length)return pathMove(ms[0]);s.sel=square===s.cur?square:null;return fundamental()}if(e.type!=='squares')return;s.pick=s.pick.includes(square)?s.pick.filter(x=>x!==square):[...s.pick,square];fundamental()})}
function pathMove(m){const s=st,e=s.e;s.g.move(m);s.cur=m.to;s.made++;s.sel=null;s.last=[m.from,m.to];s.anim=s.last;const fen=s.g.fen().split(' ');fen[1]='w';fen[3]='-';s.g.load(fen.join(' '));if(s.cur===e.target&&s.made===e.distance)return checkFund(true);if(s.made>=e.distance){s.stuck=true;attempt(e.id,true);s.msg='Il percorso minimo richiede '+e.distance+' mosse. Premi Ricomincia e cerca un percorso più breve.'}else s.msg='Mosse usate: '+s.made+'. Continua verso '+e.target+'.';fundamental()}
function checkFund(ok){const s=st,e=s.e;if(ok){s.done=true;const p=award(e.id,pts(e.id,1));s.msg='Corretto! '+(p?'+'+p+' punti. ':'')+e.why;snd('move')}else{attempt(e.id,true);s.msg='Non ancora. '+e.hint;snd('bad')}fundamental()}
// ---------- SUONI ----------
let AC=null;function tone(f,t,d,ty,v){const x=AC.currentTime+t,o=AC.createOscillator(),gn=AC.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,x);gn.gain.setValueAtTime(.0001,x);gn.gain.exponentialRampToValueAtTime(v||.3,x+.01);gn.gain.exponentialRampToValueAtTime(.0001,x+d);o.connect(gn);gn.connect(AC.destination);o.start(x);o.stop(x+d+.05)}
function snd(k){if(!sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();
if(k=="move"){tone(230,0,.09,"triangle",.4);tone(140,0,.1,"sine",.3)}else if(k=="cap"){tone(190,0,.14,"sawtooth",.22);tone(110,0,.18,"triangle",.4)}else if(k=="check"){tone(880,0,.12,"square",.1);tone(660,.1,.22,"square",.1)}else if(k=="bad"){tone(160,0,.25,"sawtooth",.15)}else if(k=="mate"){[523,415,330,262].forEach((f,i)=>tone(f,i*.16,.5,"triangle",.3));tone(131,.66,1.3,"sine",.45);tone(65,.66,1.5,"sine",.4)}}catch(e){}}
function sfx(g,m){snd(g.in_checkmate()?"mate":g.in_check()?"check":m&&m.captured?"cap":"move")}
// ---------- SCACCHIERA ----------
const CAL={};function calib(){try{const c=document.createElement("canvas").getContext("2d");c.font='88px "Noto Sans Symbols 2","Segoe UI Symbol","DejaVu Sans",sans-serif';c.textAlign="center";for(const t in GL){const m=c.measureText(GL[t]+"\uFE0E");CAL[t]=[((m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2)||0,((m.actualBoundingBoxDescent-m.actualBoundingBoxAscent)/2)||0]}}catch(e){}}
calib();
function kingSq(g,col){const B=g.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=B[r][c];if(p&&p.type=="k"&&p.color==col)return"abcdefgh"[c]+(8-r)}}
function boardHTML(g,sel,targets,hint,last,tg){last=last||[];const fl=st.flip,B=g.board(),ck=g.in_check()&&!st.nochk?kingSq(g,g.turn()):null;let h='<div id="b">';
for(let a=0;a<8;a++)for(let b=0;b<8;b++){const r=fl?7-a:a,c=fl?7-b:b,s="abcdefgh"[c]+(8-r),p=B[r][c],k=p&&(CAL[p.type]||[0,0]);
h+=`<button type="button" class="q ${(r+c)%2?"d":"l"}${s==sel?" sel":""}${targets.includes(s)?" mv":""}${s==hint?" hint":""}${last.includes(s)?" lm":""}${s==tg?" tgt":""}${s==ck?" chk":""}" data-s="${s}" aria-label="${s}${p?", "+NM[p.type]+" "+(p.color=="w"?"bianco":"nero"):", vuota"}">${b==0?`<i class="co r">${8-r}</i>`:""}${a==7?`<i class="co f">${"abcdefgh"[c]}</i>`:""}${p?`<span class="${p.color=="w"?"pw":"pb"}"><svg viewBox="0 0 100 100"><text x="${(50-k[0]).toFixed(1)}" y="${(50-k[1]).toFixed(1)}" text-anchor="middle" font-size="88" font-family="'Noto Sans Symbols 2','Segoe UI Symbol','DejaVu Sans',sans-serif">${GL[p.type]}&#xFE0E;</text></svg></span>`:""}</button>`}
return h+"</div>"}
function anim(){const a=st.anim;st.anim=null;if(!a)return;const t=document.querySelector('[data-s="'+a[1]+'"] span'),f=document.querySelector('[data-s="'+a[0]+'"]');if(!t||!f)return;const r1=f.getBoundingClientRect(),r2=t.parentElement.getBoundingClientRect();t.style.transition="none";t.style.transform=`translate(${r1.left-r2.left}px,${r1.top-r2.top}px)`;t.style.zIndex=9;t.offsetWidth;t.style.transition="transform .28s ease-in-out";t.style.transform="translate(0,0)"}
function bind(fn){anim();document.querySelectorAll(".q").forEach(e=>e.onclick=()=>fn(e.dataset.s))}
function levels(){app.innerHTML=navHeader('home','Partite')+['Primi passi','Allenamento','Sfida'].map((t,i)=>{const r=me.games[i]||{w:0,l:0,d:0};return `<button class="lv g${i}" data-level="${i}">${t}<small>Vittorie ${r.w} · Patte ${r.d} · Sconfitte ${r.l}</small></button>`}).join('')+'<p class="help">Giochi con il Bianco. Tre aiuti per partita. Il computer è un motore didattico: “Sfida” è il livello più impegnativo di questo sito, non un livello agonistico certificato. Le partite sono allenamenti, senza punti aggiuntivi.</p>';finishUI();document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startGame(+b.dataset.level))}
function startGame(lv){cancel();st={screen:'game',lv,g:new Chess(),sel:null,over:false,busy:false,hints:0,msg:'Tocca al Bianco. Scegli un pezzo.'};render()}
function game(){const s=st,g=s.g;app.innerHTML=navHeader('levels',['Primi passi','Allenamento','Sfida'][s.lv])+`<div class="c">${boardHTML(g,s.sel,s.sel&&!s.busy?g.moves({square:s.sel,verbose:true}).map(m=>m.to):[],s.hs,s.last,s.tg)}<div id="msg" role="status">${esc(s.msg)}</div><div class="row"><button id="hint" class="o" ${s.over||s.busy||s.hints>=3?'disabled':''}>💡 Aiuto (${3-s.hints})</button><button id="newgame" class="s">Nuova partita</button></div><details><summary>Mosse della partita</summary><p>${esc(g.history().join(' '))||'Nessuna mossa.'}</p></details></div>`;finishUI();$('newgame').onclick=()=>{if(!g.history().length||s.over||confirm('Iniziare una nuova partita? Quella in corso non verrà conteggiata.'))startGame(s.lv)};$('hint').onclick=()=>requestEngine(true);bind(square=>{if(s.over||s.busy||g.turn()!=='w')return;const ms=g.moves({verbose:true}).filter(m=>m.from===s.sel&&m.to===square);if(ms.length)return choosePromotion(ms,m=>{if(st!==s)return;const x=g.move(m);s.sel=null;s.hs=null;s.tg=null;s.last=[x.from,x.to];s.anim=s.last;sfx(g,x);if(!gameEnd())requestEngine(false);else game()});const p=g.get(square);s.sel=p&&p.color==='w'?square:null;game()})}
function gameEnd(){const s=st,g=s.g;if(!g.game_over()||s.over)return s.over;s.over=true;let result='d';if(g.in_checkmate()){result=g.turn()==='b'?'w':'l';s.msg=result==='w'?'Scacco matto! Hai vinto.':'Scacco matto. Ha vinto il computer: rivedi le mosse e riprova.';snd('mate')}else if(g.in_stalemate())s.msg='Patta per stallo: nessuna mossa legale, ma il re non è sotto scacco.';else if(g.insufficient_material())s.msg='Patta: materiale insufficiente per dare matto.';else if(g.in_threefold_repetition())s.msg='Patta: in questo allenamento la terza ripetizione conclude automaticamente la partita.';else s.msg='Patta: in questo allenamento la regola delle 50 mosse viene applicata automaticamente.';
 if(!teacher){const r=me.games[s.lv]||(me.games[s.lv]={w:0,l:0,d:0});r[result]++;me.revision++;save()}return true}
function createEngineWorker(){if(window.CHESS_WORKER_SOURCE){const url=URL.createObjectURL(new Blob([window.CHESS_WORKER_SOURCE],{type:'text/javascript'}));const w=new Worker(url);URL.revokeObjectURL(url);return w}return new Worker('engine-worker.js')}
function requestEngine(hint){const s=st,version=job;s.busy=true;s.msg=hint?'Cerco un suggerimento…':'Il computer pensa…';game();try{worker=createEngineWorker()}catch(e){s.busy=false;s.msg='Il motore non si avvia. Apri il sito via GitHub Pages o un server locale, non con doppio clic sul file.';return game()}
 const w=worker;const timer=setTimeout(()=>{w.terminate();if(st===s&&version===job){s.busy=false;s.msg='Il motore ha impiegato troppo tempo. Premi Riprova.';game();retryEngine(hint)}},6000);
 w.onmessage=e=>{clearTimeout(timer);w.terminate();if(worker===w)worker=null;if(st!==s||version!==job)return;s.busy=false;const u=e.data.move;if(!u){s.msg='Motore non disponibile: riprova.';game();retryEngine(hint);return}const m=s.g.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===u);if(!m){s.msg='Risposta del motore non valida. Riprova.';game();retryEngine(hint);return}if(hint){s.hints++;s.hs=m.from;s.tg=m.to;s.msg='Prova '+m.from+' → '+m.to+(m.promotion?' e promuovi a '+NM[m.promotion]:'')+'. È un suggerimento, non una garanzia di vittoria.'}else{const x=s.g.move(m);s.last=[x.from,x.to];s.anim=s.last;sfx(s.g,x);if(!gameEnd())s.msg=s.g.in_check()?'Sei sotto scacco: trova una difesa.':'Tocca a te.'}game()};
 w.onerror=()=>{clearTimeout(timer);w.terminate();if(st===s&&version===job){s.busy=false;s.msg='Impossibile avviare il motore. Controlla che engine-worker.js sia stato caricato.';game();retryEngine(hint)}};w.postMessage({fen:s.g.fen(),level:hint?2:s.lv});
}
function retryEngine(hint){const b=document.createElement('button');b.textContent='Riprova';b.onclick=()=>requestEngine(hint);app.appendChild(b)}
function teacherLogin(){app.innerHTML=navHeader('login','Accesso docente')+(cloud?`<div class="c"><p>L’accesso richiede l’account docente configurato nell’archivio.</p><label for="email">Email docente</label><input id="email" type="email" autocomplete="username"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><button id="signTeacher" class="g big">Accedi</button><p id="error" role="alert"></p></div>`:'<div class="c"><p>L’archivio condiviso non è ancora configurato. Segui LEGGIMI.md nel pacchetto per collegarlo. Nel frattempo ogni alunno può esportare il proprio riepilogo.</p></div>');finishUI();if($('signTeacher'))$('signTeacher').onclick=async()=>{const page=st;$('signTeacher').disabled=true;try{const a=await api('/auth/v1/token?grant_type=password','POST',{email:$('email').value.trim(),password:$('password').value});$('password').value='';const rows=await api('/rest/v1/teachers?user_id=eq.'+encodeURIComponent(a.user.id)+'&class_code=eq.'+encodeURIComponent(cfg.classCode)+'&select=user_id','GET',undefined,a.access_token);if(!rows.length)throw Error('Account non autorizzato per questa classe');if(st!==page)return;auth=a;teacher=true;me={name:'Insegnante',points:0,solved:{},attempts:{},games:{}};go('dashboard')}catch(e){if(st===page){$('error').textContent='Accesso non riuscito: '+e.message;$('signTeacher').disabled=false}}}}
async function dashboard(){if(!teacher||!auth)return go('teacherLogin');const page=st;app.innerHTML=navHeader('home','Risultati della classe')+'<p>Caricamento…</p>';finishUI();try{if(auth.expires_at<Date.now()/1000+60)auth=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:auth.refresh_token});const rows=await api('/rest/v1/progress?class_code=eq.'+encodeURIComponent(cfg.classCode)+'&select=owner_id,nickname,progress,updated_at&order=nickname.asc&limit=1000','GET',undefined,auth.access_token);if(st!==page)return;const data=rows.map(r=>({...r.progress,device:r.owner_id.slice(0,8),updated:r.updated_at}));app.innerHTML=navHeader('home','Risultati della classe')+`<div class="row"><button id="refresh">Aggiorna</button><button id="csv">Esporta CSV</button></div><p class="help">Ordinamento per nickname. Due righe con lo stesso nickname e un codice PC diverso indicano browser diversi. I punti sono un feedback didattico, non una valutazione certificata.</p><div class="c scroll"><table><thead><tr><th>Nickname / PC</th><th>Punti</th><th>Fond. / M1 / M2 / M3</th><th>Errori / aiuti</th><th>V / P / S</th><th>Ultimo invio</th></tr></thead><tbody>${data.map(p=>{const t=stats(p);return `<tr><td>${esc(p.name)}<br><small>${p.device}</small></td><td>${p.points}</td><td>${t.completed.join(' / ')}</td><td>${t.errors} / ${t.hints}</td><td>${t.w} / ${t.d} / ${t.l}</td><td>${new Date(p.updated).toLocaleString('it-IT')}</td></tr>`}).join('')||'<tr><td colspan="6">Nessun risultato ricevuto.</td></tr>'}</tbody></table></div>`;finishUI();$('refresh').onclick=dashboard;$('csv').onclick=()=>exportCSV(data)}catch(e){if(st===page){app.innerHTML=navHeader('home','Risultati della classe')+'<p role="alert">Impossibile leggere i risultati: '+esc(e.message)+'</p><button id="retry">Riprova</button>';finishUI();$('retry').onclick=dashboard}}}
function stats(p){let completed=[FUNDAMENTALS.filter(e=>p.solved?.[e.id]).length,...[1,2,3].map(n=>PUZZLES.filter(e=>e.n===n&&p.solved?.[e.id]).length)];let errors=0,hints=0,w=0,d=0,l=0;for(const x of Object.values(p.attempts||{})){errors+=x.errors||0;hints+=x.hints||0}for(const x of Object.values(p.games||{})){w+=x.w||0;d+=x.d||0;l+=x.l||0}return{completed,errors,hints,w,d,l}}
function exportCSV(data){const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const rows=[['Nickname','PC','Punti','Fondamentali','Matto1','Matto2','Matto3','Errori','Aiuti','Vittorie','Patte','Sconfitte','Ultimo invio'],...data.map(p=>{const s=stats(p);return[p.name,p.device||'locale',p.points,...s.completed,s.errors,s.hints,s.w,s.d,s.l,p.updated||new Date().toISOString()]})];const url=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='risultati-scacchi.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
if(typeof Chess==='undefined'){app.textContent='Manca vendor/chess.min.js: carica tutti i file del pacchetto.';}else {status();render();}
